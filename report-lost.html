<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost & Found — Report Lost Item</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- Interactive Background Blobs -->
  <div class="blob-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <nav class="navbar">
    <div class="logo">Found<span>It</span></div>
    <div class="navbar-right">
      <span class="user-email" id="user-email"></span>
      <a href="home.html" class="btn btn-secondary btn-sm">Back</a>
      <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container-sm" style="padding-top:2.5rem">

    <div class="page-header">
      <h1>Report a <span>Lost</span> Item</h1>
      <p>The more detail you add, the easier it is to find a match.</p>
    </div>

    <div class="form-card">
      <div id="alert" class="alert"></div>

      <div class="form-row">
        <div class="form-group">
          <label>Item Type *</label>
          <select id="type">
            <option value="">Select type…</option>
            <option>Wallet</option>
            <option>Phone</option>
            <option>Keys</option>
            <option>Bag / Backpack</option>
            <option>Water Bottle</option>
            <option>Laptop</option>
            <option>Earphones / AirPods</option>
            <option>ID Card</option>
            <option>Glasses</option>
            <option>Umbrella</option>
            <option>Jacket / Hoodie</option>
            <option>Notebook</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Colour *</label>
          <select id="colour">
            <option value="">Select colour…</option>
            <option>Black</option>
            <option>White</option>
            <option>Grey</option>
            <option>Brown</option>
            <option>Red</option>
            <option>Orange</option>
            <option>Yellow</option>
            <option>Green</option>
            <option>Blue</option>
            <option>Purple</option>
            <option>Pink</option>
            <option>Multicolour</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Where did you lose it? *</label>
        <select id="location">
          <option value="">Select location…</option>
          <option>Library</option>
          <option>Cafeteria / Canteen</option>
          <option>Main Block</option>
          <option>Lab Block</option>
          <option>Auditorium</option>
          <option>Sports Ground</option>
          <option>Parking Area</option>
          <option>Hostel</option>
          <option>Admin Block</option>
          <option>Common Room</option>
          <option>Not Sure</option>
        </select>
      </div>

      <div class="form-group">
        <label>Extra Details</label>
        <textarea id="notes"
          placeholder="Any identifying features — brand, sticker, name tag, scratches etc."></textarea>
      </div>

      <div class="form-group">
        <label>Photo (optional)</label>
        <div class="file-upload-area">
          <input type="file" id="photo" accept="image/*" />
          <div class="upload-icon">📷</div>
          <p>Tap to upload a photo</p>
          <p class="file-name" id="file-name"></p>
        </div>
        <div class="photo-preview" id="photo-preview">
          <img id="preview-img" src="" alt="Preview" />
        </div>
      </div>

      <button class="btn btn-primary btn-full" id="submit-btn" onclick="submitLostReport()">
        Submit Report
      </button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/report-lost.js"></script>
</body>

</html>
